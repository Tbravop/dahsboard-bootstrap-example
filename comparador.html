<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparador de Dashboards: Bootstrap 6 vs. DESIGN.md + AGENTS.md</title>
  <script>window.process = { env: { NODE_ENV: "development" } };</script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "agentation": "/node_modules/agentation/dist/index.mjs"
    }
  }
  </script>
  <link rel="stylesheet" href="./design-system/tokens.css">
  <style>
    .comparator-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-sm);
      padding: var(--space-sm);
      block-size: calc(100vh - 4.25rem);
    }
    .comparator-pane {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-md);
      overflow: hidden;
      background-color: var(--color-bg-surface);
    }
    .comparator-pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-xs) var(--space-sm);
      background-color: var(--color-bg-surface-subtle);
      border-block-end: 1px solid var(--color-border-subtle);
    }
    .comparator-iframe {
      inline-size: 100%;
      block-size: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <header class="ds-page-header">
    <div class="ds-toolbar-row">
      <div style="display: flex; align-items: center; gap: var(--space-sm);">
        <h1 class="ds-h3">Comparador en Vivo: Bootstrap 6 vs. DESIGN.md + AGENTS.md</h1>
        <span class="ds-badge ds-badge-brand">Prueba de Container Queries (@container)</span>
      </div>
      <div class="ds-slicer-group">
        <a href="./index.html" class="ds-btn" style="text-decoration: none;">Ver Versión Bootstrap 6</a>
        <a href="./design-system/dashboard.html" class="ds-btn ds-btn-primary" style="text-decoration: none;">Ver Versión DESIGN.md</a>
      </div>
    </div>
  </header>

  <main class="comparator-layout">
    <section class="comparator-pane" aria-label="Versión 1: Bootstrap 6">
      <div class="comparator-pane-header">
        <strong class="ds-small">1. Versión Bootstrap 6 (`twbs/bootstrap` skills)</strong>
        <a href="./index.html" class="ds-small" style="color: var(--color-brand-primary);">./index.html ↗</a>
      </div>
      <iframe class="comparator-iframe" id="iframeBootstrap" src="./index.html" title="Dashboard Bootstrap 6"></iframe>
    </section>

    <section class="comparator-pane" aria-label="Versión 2: DESIGN.md + AGENTS.md">
      <div class="comparator-pane-header">
        <strong class="ds-small">2. Versión DESIGN.md + AGENTS.md + writing-ui-components</strong>
        <a href="./design-system/dashboard.html" class="ds-small" style="color: var(--color-brand-primary);">./design-system/dashboard.html ↗</a>
      </div>
      <iframe class="comparator-iframe" id="iframeDesignSystem" src="./design-system/dashboard.html" title="Dashboard DESIGN.md"></iframe>
    </section>
  </main>

  <script>
    (function () {
      const STORAGE_THEME_KEY = 'helpdesk_ds_theme_v1';
      const iframes = document.querySelectorAll('.comparator-iframe');

      function applyGlobalComparatorTheme(theme) {
        if (theme !== 'dark' && theme !== 'light') return;
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem(STORAGE_THEME_KEY, theme);
        iframes.forEach(frame => {
          frame.contentWindow?.postMessage({ type: 'HELPDESK_APPLY_THEME', theme }, '*');
        });
      }

      const initialTheme = localStorage.getItem(STORAGE_THEME_KEY) || 'light';
      document.documentElement.setAttribute('data-theme', initialTheme);

      iframes.forEach(frame => {
        frame.addEventListener('load', () => {
          const currentTheme = localStorage.getItem(STORAGE_THEME_KEY) || 'light';
          frame.contentWindow?.postMessage({ type: 'HELPDESK_APPLY_THEME', theme: currentTheme }, '*');
        });
      });

      window.addEventListener('message', event => {
        if (event.data && event.data.type === 'HELPDESK_SYNC_THEME') {
          applyGlobalComparatorTheme(event.data.theme);
        }
      });
    })();
  </script>
  <script type="module" src="./agentation-mount.js?v=dev2"></script>
</body>
</html>
